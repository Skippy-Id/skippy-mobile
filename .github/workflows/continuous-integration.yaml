name: Continuous Integration

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-22.04
    name: Validate
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22.21.1'

      - uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install

      - name: Compile
        run: pnpm build

      - name: Check Style
        run: pnpm style:check

      - name: Check Types
        run: pnpm types:check

      # Catches a brand that is half-registered (config but no theme, bad asset
      # path, unknown EXPO_PUBLIC_APP_BRAND) without paying for a native build.
      - name: Resolve every brand's Expo config
        working-directory: apps/wallet
        run: |
          for brand in $(node -e "import('./brands/configs.js').then(m => console.log(m.brandNames.join(' ')))"); do
            echo "--- $brand"
            EXPO_PUBLIC_APP_BRAND="$brand" APP_VARIANT=development npx expo config --type public > /dev/null
          done

      - name: Check for unresolved release placeholders
        run: node scripts/check-placeholders.mjs --warn-only
